[project]
name = "itbi-sp"
version = "0.1.0"
description = "Previsão de preço de apartamentos em São Paulo a partir das transações reais de ITBI"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow",
    "python-calamine",
    "scikit-learn>=1.6",
    "lightgbm>=4.3",
    "shap",
    "matplotlib",
    "requests",
    "joblib",
]

[project.optional-dependencies]
dev = ["pytest", "jupyter", "openpyxl"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
